        for (var i = 0; i < results.length; i++) {
            if (results[i]['@type'] === type) {
                table += '<tr>';
                table += '<td>' + results[i]['@name'] + '</td>';
                table += '<td>' + results[i]['@severity'] + '</td>';
                table += '<td>' + results[i]['@host'] + '</td>';
                table += '<td>' + results[i]['@port'] + '</td>';
                table += '<td>' + results[i]['@qod'] + '</td>';
                table += '<td>' + results[i]['#text'] + '</td>';
                table += '</tr>';
            }
        }
        table += '</table>';
        return table;
    }

    // Function to filter table rows based on input criteria
    function filterTable(inputId, column) {
        //console.log(inputId);
        //console.log(column);
        var input, filter, table, tr, td, i, txtValue;
        input = document.getElementById(inputId);
        if (input.value) {
        //console.log(input.value);
        filter = parseFloat(input.value);
        //console.log(filter);
        table = document.getElementById("AlarmTable");
        tr = table.getElementsByTagName("tr");
        for (i = 0; i < tr.length; i++) {
            td = tr[i].getElementsByTagName("td")[column];
            if (td) {
                //console.log(td.textContent);
                //console.log(td.innerText);
                txtValue = td.innerText;
                if (parseFloat(txtValue) >= filter) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
        }
        else {
            table = document.getElementById("AlarmTable");
            tr = table.getElementsByTagName("tr");
            for (i = 0; i < tr.length; i++) {
                td = tr[i].getElementsByTagName("td")[column];
                if (td) {
                    tr[i].style.display = "";
                    }
                }
            }
    }

    // Function to sort table rows based on the selected column
    function sortTable(column) {
        var table, rows, switching, i, x, y, shouldSwitch;
        table = document.getElementById("AlarmTable");
        switching = true;
        //console.log(table);
        while (switching) {
            switching = false;
            rows = table.rows;
            console.log(rows);
            for (i = 1; i < (rows.length - 1); i++) {
                shouldSwitch = false;
                x = rows[i].getElementsByTagName("td")[column];
                y = rows[i + 1].getElementsByTagName("td")[column];
                //console.log(x.innerText+" "+y.innerText);
                if (parseFloat(y.innerText) > parseFloat(x.innerText)) {
                    shouldSwitch = true;
                    break;
                }
            }
            if (shouldSwitch) {
                rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                switching = true;
            }
        }
    }

    // Display JSON data as tables
    document.getElementById('_alarmTable').innerHTML = jsonToTable(jsonData, "Alarm");
    sortTable(1);
    document.getElementById('_logMessageTable').innerHTML = jsonToTable(jsonData, "Log Message");
    document.getElementById('_errorMessageTable').innerHTML = jsonToTable(jsonData, "Error Message");
</script>
